[package]
name = "test_program"
version = "0.0.1"
edition = "2021"
license = "CC-BY-NC-4.0"
description = "Devnet companion program for vault CPI testing"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["bpf-entrypoint"]
bpf-entrypoint = []

[dependencies]
pinocchio = { version = "0.11.1", default-features = true, features = ["cpi", "alloc"] }
pinocchio-associated-token-account = "0.4.0"
pinocchio-system = "0.6.0"
pinocchio-token = "0.6.0"
pinocchio-token-2022 = "0.3.0"
pinocchio-log = { version = "0.5.1", default-features = false, features = ["macro"] }
solana-address = { version = "2.4.0", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
   'cfg(target_os, values("solana"))',
] }
