[package]
name = "app-specific-delegated-vaults"
version = "0.0.1"
edition = "2021"
license = "CC-BY-NC-4.0"
description = "App specific delegated vaults — Solana program (Pinocchio) with per-user vault PDAs and delegate-authorized app CPI."
autotests = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["bpf-entrypoint"]
# Disable when consuming this crate as a library (avoids duplicate entrypoint symbols).
bpf-entrypoint = []
# Mollusk SBF integration tests (`program/tests/*`). Requires `app_specific_delegated_vaults.so` in `target/deploy/`.
test-sbf = []

[dependencies]
# `default-features = false` omits Pinocchio `alloc` / `slice-cpi`; `app_ix` uses `invoke_signed_unchecked` + split stack frames (≤64 accounts).
pinocchio = { version = "0.11.1", default-features = false, features = ["cpi", "copy", "sha2"] }
pinocchio-associated-token-account = "0.4.0"
pinocchio-system = "0.6.0"
pinocchio-token = "0.6.0"
pinocchio-token-2022 = "0.3.0"
pinocchio-log = { version = "0.5.1", default-features = false, features = ["macro"] }
solana-address = { version = "2.4.0", features = ["curve25519"] }
solana-define-syscall = { version = "5.0", features = ["unstable-static-syscalls"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
   'cfg(target_os, values("solana"))',
] }

# Mollusk + BPF: run `cargo build-sbf` in `program/` and `../test_program/`, then either:
#   cargo vault-test                    (only `mollusk_vault` integration tests)
#   ./scripts/run-vault-tests.ps1   (or run-vault-tests.sh)
# Compute units while tuning: set VAULT_LOG_CU=1 and run with `--nocapture` (see tests/mollusk_vault.rs). Bench TSV: VAULT_CU_REPORT + log_cu_bench.
# Built BPF: `program/target/deploy/app_specific_delegated_vaults.so`; test helper: `../test_program/target/deploy/test_program.so`.
[[test]]
name = "mollusk_vault"
path = "tests/mollusk_vault.rs"
required-features = ["test-sbf"]

[dev-dependencies]
mollusk-svm = "0.12"
mollusk-svm-programs-token = "0.12"
# Must match `mollusk-svm` (otherwise `Account` tuples disagree at type level).
solana-account = "3.4"
solana-instruction = "3.1"
solana-instructions-sysvar = "3.0"
solana-program-error = "3.0"
solana-program-option = "3.1"
solana-program-pack = "3.1"
solana-pubkey = "4.0"
solana-sdk-ids = "3.1"
spl-associated-token-account-interface = "2.0"
spl-token-interface = "2.0"
test_program = { path = "../test_program" }

[profile.release]
debug = 1
