[package]
name = "vault-sdk"
version = "0.1.0"
edition = "2021"
license = "CC-BY-NC-4.0"
description = "Off-chain Rust client for the vault Solana program (instruction builders, PDAs, account layout)."
keywords = ["solana", "vault", "spl"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
solana-instruction = { version = "2.2.1", default-features = false, features = ["std"] }
solana-pubkey = { version = "2.2.1", default-features = false, features = ["std", "curve25519"] }
thiserror = "2"
